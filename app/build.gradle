plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ua.calculator.ups'
    compileSdk 35

    defaultConfig {
        applicationId 'ua.calculator.ups'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '0.2'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}
